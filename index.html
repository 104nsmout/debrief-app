<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="description" content="In-cockpit maneuver grading that writes the student debrief.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debrief">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<title>Maneuver Debrief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-screen phone app on black, camo hero, lime-to-acid gradient for the one primary action */
:root{
  --bg:#000000; --surface:#131313; --surface-2:#1B1B1B; --sunk:#242424;
  --ink:#F4F4F4; --ink-2:#9B9B9B; --line:#2C2C2C;
  /* themed accent — follows the ACS library in use */
  --go:#B6F34A; --on-go:#07130A; --go-soft:#16220C;
  --grad:linear-gradient(100deg,#9EFD7A 0%,#C7FF4C 52%,#E7F529 100%);
  /* verdict colors — fixed in every theme, so a grade never changes color */
  --sat:#B6F34A; --on-sat:#07130A;
  --sat-grad:linear-gradient(100deg,#9EFD7A 0%,#C7FF4C 52%,#E7F529 100%);
  --warn:#FF8A3D; --on-warn:#1A0D03; --warn-soft:#2A1507; --warn-line:#4A2A12;
  --topo:#1E1E1E;
  --display:'Archivo',system-ui,-apple-system,sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
/* instrument: magenta is the GPS course line, cyan the sky half of the AI */
:root[data-lib="instrument"]{
  --go:#3DD5F3; --on-go:#04171C; --go-soft:#0B2027;
  --grad:linear-gradient(100deg,#2FC4EE 0%,#5BE0F7 52%,#9DF2FF 100%);
}
/* commercial: gold for the professional certificate */
:root[data-lib="commercial"]{
  --go:#F5B700; --on-go:#1A1200; --go-soft:#2B2008;
  --grad:linear-gradient(100deg,#E5A200 0%,#F5B700 52%,#FFD75A 100%);
}
html,body{height:100%}
[hidden]{display:none!important}
#topoBg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;-webkit-mask-image:radial-gradient(125% 75% at 50% 46%,rgba(0,0,0,.10) 0%,rgba(0,0,0,.42) 52%,#000 100%);mask-image:radial-gradient(125% 75% at 50% 46%,rgba(0,0,0,.10) 0%,rgba(0,0,0,.42) 52%,#000 100%)}
#topoBg path{fill:none;stroke:var(--topo);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{box-sizing:border-box;min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:16px}
section{flex:1;display:flex;flex-direction:column;min-width:0}
@media (pointer:coarse){ #app{max-width:none} }
/* a phone whose viewer lays the page out at desktop width then scales it down:
   grow the shell so the result is still thumb-sized on the glass */
@media (pointer:coarse) and (min-width:620px) and (min-height:620px){
  body{font-size:25px}
  #app{padding-block:24px 26px}
  .wordmark{font-size:42px;letter-spacing:4px}
  .eyebrow{font-size:18px}
  .hero{border-radius:34px;padding:36px 30px 32px;min-height:420px;max-height:720px;gap:22px}
  .pill{min-height:108px;font-size:40px;letter-spacing:2px}
  .primary .big{font-size:38px}
  .grade{min-height:clamp(210px,19vh,300px);border-radius:32px}
  .grade .big{font-size:76px}
  .grade .sub{font-size:22px}
  .utils button{min-height:94px;font-size:19px;border-radius:20px}
  .utils svg,.circbtn svg{width:30px;height:30px}
  .chip{font-size:22px;padding:11px 18px;border-radius:11px}
  .note{font-size:21px;padding:18px 21px;border-radius:15px}
  input[type=text],textarea,select{font-size:26px;padding:18px 19px;border-radius:16px}
  label.fl{font-size:18px}
  .rowitem{padding:17px 18px;gap:16px}
  .pick{padding:18px 19px;gap:18px}
  .pick input{width:38px;height:38px}
  .areahead{font-size:25px;padding:12px 19px}
  .card,.sheet .inner{border-radius:20px}
  .tag{font-size:18px;min-width:88px;border-radius:8px}
  .why{min-height:150px;border-radius:23px}
  .why .n{font-size:34px}
  .why .lim{font-size:19px}
  .stat .n{font-size:40px}
  .stat .l{font-size:18px}
  .ghost{min-height:76px;font-size:24px;border-radius:18px}
  .link{font-size:21px}
  .jr{min-height:92px}
  .jr .nm{font-size:25px}
  .jr .tl{font-size:18px}
  .sw-del{width:160px;font-size:21px}
  .swipe.open .sw-in,.swipe:focus-within .sw-in{transform:translateX(-160px)}
  .toast{font-size:23px;padding:17px 25px;border-radius:17px}
  .qmark{font-size:98px}
  .qtext{font-size:50px;margin-top:34px}
  .qauthor{font-size:19px;margin-top:30px}
  .qnote{font-size:17px}
  .status{font-size:18px;margin-top:20px}
  .sdot{width:10px;height:10px}
  .resume{border-radius:22px;padding:20px 23px;border-left-width:6px}
  .rname{font-size:42px}
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2{margin:0;text-wrap:balance}
.d{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.2px;line-height:1}

/* home: the quote carries the screen, the gradient pill is the only action */
.quote{flex:1 1 auto;min-height:38vh;display:flex;flex-direction:column;justify-content:center;margin:0;padding:10px 2px 6px}
.qmark{font-family:var(--display);font-weight:800;font-size:60px;line-height:.42;color:var(--go)}
.qtext{margin:22px 0 0;font-family:var(--display);font-weight:700;font-size:31px;line-height:1.17;letter-spacing:-.3px;color:var(--ink);text-wrap:balance}
.qauthor{margin-top:20px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-2)}
.qnote{margin-top:7px;font-family:var(--mono);font-size:11px;letter-spacing:.3px;color:#6B6B6B}
.status{flex:none;margin-top:13px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-2)}
.sdot{width:6px;height:6px;border-radius:4px;background:var(--go);box-shadow:0 0 8px rgba(182,243,74,.8)}
.resume{flex:none;display:block;width:100%;text-align:left;color:inherit;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:13px 15px;margin-bottom:13px}
.rname{display:block;margin-top:6px;font-size:26px;color:var(--ink)}

/* camo field — organic blobs from turbulence, sits behind the hero and the page edge */
.camo{position:absolute;inset:0;width:100%;height:100%;opacity:.9;pointer-events:none}
.hero{position:relative;overflow:hidden;border-radius:22px;background:#0A0A0A;border:1px solid var(--line);
  padding:22px 18px 20px;display:flex;flex-direction:column;gap:14px;isolation:isolate;
  flex:1 1 auto;min-height:250px;max-height:430px;justify-content:flex-end}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:66%;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,10,10,0) 0%,rgba(10,10,10,.86) 46%,rgba(10,10,10,.96) 100%)}
.hero>*:not(.camo){position:relative;z-index:1}
.wordmark{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:2.5px;text-transform:uppercase}
.pill{border:0;border-radius:999px;background:var(--grad);color:var(--on-go);min-height:66px;font-size:24px;flex:none;font-family:var(--display);
  font-weight:800;text-transform:uppercase;letter-spacing:1.4px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.circbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{flex-grow:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;flex:none}
.iconbtn{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:10px}
.iconbtn:hover{background:var(--surface-2)}
.ghost{border:1.5px solid var(--line);background:none;color:var(--go);border-radius:11px;font-weight:600;min-height:46px;padding:0 14px}
.ghost:hover{background:var(--surface-2)}
.link{border:0;background:none;padding:0;color:var(--warn);font-weight:600;font-size:13px;min-height:44px}
.primary{border:0;border-radius:999px;background:var(--grad);color:var(--on-go);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%}
.primary .big{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:1.3px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>*+*{border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 11px;border-radius:7px;background:var(--go-soft);color:var(--go);font-family:var(--mono);font-size:13px;font-weight:600}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.note{background:var(--surface-2);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--ink-2)}
input[type=text],textarea,select{width:100%;box-sizing:border-box;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--body);font-size:16px}
textarea{resize:vertical;line-height:1.45}
label.fl{display:block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1px;color:var(--ink-2);margin-bottom:5px}
.field+.field{margin-top:12px}
.pick{display:flex;align-items:center;gap:12px;padding:13px 12px;background:none;border:0;width:100%;box-sizing:border-box;text-align:left;color:inherit}
.pick input{flex:none;width:26px;height:26px;margin:0;accent-color:var(--go)}
.areahead{background:var(--surface-2);padding:7px 12px;font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.3px;color:var(--go)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:var(--sunk);border-radius:10px;padding:4px}
.seg button{min-height:42px;border:0;border-radius:7px;background:none;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--go);color:var(--on-go)}
.bar{display:grid;gap:4px;flex:none}
.bar span{height:5px;border-radius:3px;background:var(--sunk)}
.bar span.done{background:var(--sat)}
.bar span.now{background:var(--ink)}
.bar span.bad{background:var(--warn)}
.grades{display:flex;flex-direction:column;gap:12px;margin-top:auto;flex:none}
.grade{border:0;border-radius:20px;box-sizing:border-box;min-height:clamp(128px,19vh,176px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:box-shadow .18s ease,color .18s ease,transform .09s ease-out}
.grade:active{transform:scale(.985)}
/* large uppercase wants negative tracking; the +1.2px here is eyebrow spacing
   and reads as amateur above about 24px */
.grade .big{font-family:var(--display);font-weight:800;font-size:46px;text-transform:uppercase;letter-spacing:-.6px;line-height:1}
.grade .sub{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.grade.sat{background:var(--sat-grad);color:var(--on-sat)}
.grade.sat .sub{color:#143007;opacity:.75}
.grade.unsat{background:var(--warn);color:var(--on-warn)}
.grade.unsat .sub{opacity:.85}
.utils{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;flex:none}
.utils button{min-height:58px;border:1.5px solid var(--line);border-radius:12px;background:none;color:var(--go);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;padding:0 2px}
.utils button:disabled{opacity:.4}
.whygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
/* a little shorter than the old full-screen picker: these now share the
   maneuver screen rather than owning it */
.why{min-height:76px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;text-align:center}
.why .n{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1.02;color:var(--ink)}
.why .lim{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.why[aria-pressed=true]{background:var(--warn);border-color:var(--warn)}
.why[aria-pressed=true] .n,.why[aria-pressed=true] .lim{color:var(--on-warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.stat{border-radius:10px;padding:9px 10px}
.stat .n{font-family:var(--mono);font-size:25px;font-weight:600;line-height:1.1}
.stat .l{font-size:10px;font-weight:600;letter-spacing:.2px;line-height:1.2}
.stat.sat{background:var(--sat);color:var(--on-sat)}
.stat.sat .l{color:rgba(7,19,10,.7)}
.stat.unsat{background:var(--warn);color:var(--on-warn)}
.stat.no{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.rowitem{display:flex;align-items:center;gap:10px;padding:10px 11px;background:none;border:0;width:100%;box-sizing:border-box;text-align:left;color:inherit}

/* --- grade screen --- */
.nextup{flex:none;margin-top:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:1.1px;color:var(--ink-2)}
.attwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:16px}
.att{border-radius:13px;margin-bottom:8px}
.att .sw-in{border:1px solid var(--line);border-radius:13px;padding:11px 13px}
.attnote{display:block;width:100%;margin-top:7px;text-align:left;background:var(--surface-2);
  border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;min-height:44px}
.attnote.empty{color:var(--ink-2)}
.attwhy{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--warn)}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;flex:none}
.nav button{min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:none;color:var(--go);
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button:disabled{opacity:.35}
.nav button.end{border-color:var(--warn);background:var(--warn-soft);color:var(--warn);font-weight:700}
.nav button.muted{color:var(--ink-2)}
.nav button.strong{border-color:var(--go);background:var(--go-soft);font-weight:700}
.danger{border:0;border-radius:11px;background:var(--warn);color:var(--on-warn);font-weight:700;min-height:48px;font-size:15px}
/* once a maneuver has an attempt, the grade buttons recede and sit side by side */
#v-grade.graded .grades{flex-direction:row;gap:10px;margin-top:0}
#v-grade.graded .grade{flex:1 1 0;min-height:96px;border-radius:20px;padding:10px}
#v-grade.graded .grade .big{font-size:27px}
#v-grade.graded .grade .sub{font-size:10.5px;letter-spacing:.8px}
/* the grade you chose stays bright; the other recedes but stays pressable */
/* the recessive state is painted with an inset fill rather than a background
   swap, because a gradient cannot cross-fade — and a hairline keeps it reading
   as an inactive object instead of a hole in the page */
.grade.dim{color:#9A9A9A;box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 999px #171717}
.grade.dim .sub{color:#858585;opacity:1}
.grade .tick{display:none}
.grade.picked .tick{display:block;margin-bottom:2px}
.grade.picked .tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:tickin .22s ease-out forwards}
@keyframes tickin{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .grade{transition:none}
  .grade:active{transform:none}
  .grade.picked .tick path{animation:none;stroke-dashoffset:0}
}
/* area headers double as select-all for their section */
.areahead{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;text-align:left;border:0;min-height:44px}
.areahead .cnt{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-2)}
.areahead .cnt.on{color:var(--go)}


/* ---- launch animation ----
   Pure CSS, so it always clears itself even if no script ever runs. */
#splash{position:fixed;inset:0;z-index:200;background:var(--sat-grad);
  display:flex;align-items:center;justify-content:center;
  animation:sp-iris .40s cubic-bezier(.65,0,.35,1) .74s forwards}
@keyframes sp-iris{from{clip-path:circle(150% at 50% 50%)}to{clip-path:circle(0% at 50% 50%)}}
.sp-mark{width:min(42vw,186px);height:auto;overflow:visible}
/* dashoffset starts 2 units past the dash so the round linecap cannot show
   as a stray dot at the path start before the stroke begins */
.sp-check{fill:none;stroke:#07130A;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:150;stroke-dashoffset:152;
  animation:sp-draw .40s cubic-bezier(.35,0,.25,1) .06s forwards}
@keyframes sp-draw{to{stroke-dashoffset:0}}
/* The departure, placed at the stroke's end point in user units. An earlier
   version rode the path with offset-path; on an SVG child that mixes user
   units with CSS pixels and lands in the wrong place, so the dot is positioned
   explicitly instead. */
.sp-dot{fill:#07130A;opacity:0;animation:sp-depart .26s cubic-bezier(.3,0,1,1) .44s forwards}
@keyframes sp-depart{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(58px,-58px)}}
@keyframes sp-fade{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  #splash{animation:sp-fade .18s linear .12s forwards}
  .sp-check{stroke-dashoffset:0;animation:none}
  .sp-dot{display:none}
}

/* the in-progress card swipes away like a recent debrief */
#resumeWrap{flex:none;border-radius:14px;margin-bottom:13px}
#resumeWrap .sw-in{border-radius:14px}
#resumeWrap .resume{margin-bottom:0}

/* queue rows swipe like every other list in the app. The sheet's own
   background already matches .sw-in, so only the row chrome needs resetting. */
/* no warn fill on the wrapper: .sw-del already paints the reveal, and a
   wrapper fill shows as a sliver around the inner layer's rounded corners.
   .swipe.jrow outranks .swipe, which sets it further down. */
.swipe.jrow{position:relative;overflow:hidden;border-radius:10px;background:transparent}
.jrow .jr{border-bottom:0}
/* exactly one element rounds: the wrapper, which already clips with
   overflow:hidden. Rounding the stacked layers too put two antialiased
   curves on the same pixels and the reveal colour bled between them. */
.jrow + .jrow{margin-top:2px}
.jrow.gone .jr{opacity:.45}
.dropall{width:100%;box-sizing:border-box;margin-bottom:10px;flex:none}

/* swipe-to-delete row */
.swipe{position:relative;overflow:hidden;background:var(--warn)}
.sw-del{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--warn);color:var(--on-warn);
  font-family:var(--display);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.sw-in{position:relative;background:var(--surface);transform:translateX(0);transition:transform .18s ease;touch-action:pan-y}
.swipe.open .sw-in{transform:translateX(-96px)}
.swipe:focus-within .sw-in{transform:translateX(-96px)}
@media (hover:hover){ .swipe:hover .sw-in{transform:translateX(-96px)} }
@media (prefers-reduced-motion:reduce){ .sw-in{transition:none} }
.tag{flex:none;min-width:54px;text-align:center;padding:3px 6px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:600}
.tag.sat{background:var(--sat);color:var(--on-sat)}
.tag.unsat{background:var(--warn);color:var(--on-warn)}
.tag.no{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:5px}
.dots span{width:14px;height:14px;border-radius:8px;background:var(--go)}
.dots span.bad{background:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30;
  padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet .inner{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:488px;
  max-height:80vh;display:flex;flex-direction:column;min-height:0}
.sheet .list{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;margin:0 -16px;padding:0 16px}
.jr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;background:none;
  border:0;border-bottom:1px solid var(--line);padding:11px 2px;min-height:56px}
.jr:last-child{border-bottom:0}
.jr.now{background:var(--go-soft);border-radius:10px;border-bottom-color:transparent;padding-left:10px;padding-right:10px}
.jr .nm{display:block;font-size:15px;font-weight:600;line-height:1.25}
.jr .tl{display:block;font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep{border-top:3px solid var(--go);background:var(--surface);border-radius:4px;padding:16px}
.rep h2{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.3px;color:var(--go);border-bottom:1.5px solid var(--go);padding-bottom:3px;margin-top:4px}
.rep table{width:100%;border-collapse:collapse;font-size:13px}
.rep th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.7px;color:var(--ink-2);font-weight:600;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.rep th:last-child,.rep td:last-child{padding-right:0}
.rep td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rep td:first-child{width:38%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--go);color:var(--on-go);
  padding:11px 16px;border-radius:11px;font-size:14px;font-weight:600;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* full-screen image preview — fallback where the share sheet is unavailable */
.imgov{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.imgov-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.imgov-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;
  align-items:center;gap:16px;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.imgov-scroll img{width:100%;max-width:430px;height:auto;border-radius:12px;display:block}
.imgov-dl{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:48px;padding:0 22px}
@page{margin:0}
@media print{
  #topoBg{display:none}
  html,body{height:auto;background:#fff;color:#000}
  /* the shell is a flex column around a scrolling pane; both clip the printed page */
  #app{max-width:none;min-height:0;display:block;padding:0!important}
  section{display:block!important;flex:none!important}
  .scroll{overflow:visible!important;max-height:none!important;min-height:0!important;
    flex:none!important;margin-top:0!important}
  /* the pane's trailing spacer is enough to push out a blank final page */
  #v-debrief .scroll > div:last-child{display:none!important}
  .noprint{display:none!important}
  /* page margins live on the report itself, so the printed box is exactly the content */
  .rep{padding:12mm 12mm 10mm;border-top:0;border-radius:0}
  /* strip the dark theme out of the report, including inline-styled panels */
  .rep,.rep *{background:transparent!important;color:#000!important;box-shadow:none!important}
  .rep .panel{background:#F3F3F3!important;border:1px solid #D8D8D8!important;border-radius:4px}
  .rephead{border-bottom-color:#1F3A5F!important}
  .rep h2{color:#1F3A5F!important;border-color:#1F3A5F!important;break-after:avoid}
  .rep th,.rep td{border-color:#CFCFCF!important}
  .rep .tag-unsat{color:#A33500!important;font-weight:700}
  .rep .tag-sat{color:#1F3A5F!important;font-weight:700}
  .rep .tag-no{color:#6B6B6B!important}
  tr,.row{break-inside:avoid}
}
</style>

<div id="splash" aria-hidden="true">
  <svg class="sp-mark" viewBox="0 0 160 160" aria-hidden="true">
    <path class="sp-check" d="M34 86 L66 118 L128 40"/>
    <circle class="sp-dot" cx="128" cy="40" r="8"/>
  </svg>
</div>
<script>
/* Attached here, inline, rather than in the main script at the end of the file:
   the splash is on screen long before a 440KB document finishes parsing, so a
   listener added down there misses an early tap. The CSS clears the splash on
   its own regardless — this only makes it skippable. */
(function(){
  var sp=document.getElementById("splash");
  if(!sp) return;
  function kill(){ if(sp && sp.parentNode) sp.parentNode.removeChild(sp); sp=null; }
  sp.addEventListener("click",kill);
  sp.addEventListener("touchstart",kill,{passive:true});
  sp.addEventListener("animationend",function(ev){ if(ev.target===sp) kill(); });
  setTimeout(kill,2600);
})();
</script>

<div id="app">

<!-- HOME -->
<section id="v-home">
  <div class="topbar">
    <div class="row" style="gap:10px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--go)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2.5-7 3.5 14 3-7h7"/></svg>
      <span class="wordmark">Debrief</span>
    </div>
    <span class="mono" style="font-size:12px;color:var(--ink-2);letter-spacing:1.2px" id="homeDate"></span>
  </div>

  <figure class="quote" id="quoteBox">
    <div class="qmark" aria-hidden="true">&ldquo;</div>
    <blockquote class="qtext" id="qText"></blockquote>
    <figcaption>
      <div class="qauthor" id="qAuthor"></div>
      <div class="qnote" id="qNote" hidden></div>
    </figcaption>
  </figure>

  <div class="swipe" id="resumeWrap" hidden>
    <button class="sw-del" id="resumeDel" type="button">Delete</button>
    <div class="sw-in">
      <button id="resumeBtn" class="resume">
        <span class="eyebrow" style="color:var(--warn)">IN PROGRESS &middot; TAP TO RESUME</span>
        <span class="rname d" id="resumeTitle">&mdash;</span>
        <span class="muted" style="display:block;font-size:13px" id="resumeSub"></span>
        <span class="bar" id="resumeBar" style="margin-top:10px"></span>
      </button>
    </div>
  </div>

  <button class="pill" id="newFlightBtn">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    New Flight
  </button>

  <div class="status"><span class="sdot" aria-hidden="true"></span>Offline ready</div>

  <div id="recentWrap" class="stack" style="margin-top:26px" hidden>
    <div class="row" style="align-items:baseline">
      <span class="eyebrow sp">RECENT DEBRIEFS</span>
      <span class="eyebrow" id="recentCount"></span>
    </div>
    <div class="card" id="recentList"></div>
  </div>
</section>

<!-- SETUP -->
<section id="v-setup" hidden>
  <div class="topbar">
    <button class="iconbtn" data-go="home" aria-label="Back to home" style="margin-left:-10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--go)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="d sp" style="font-size:27px;color:var(--ink)">New Flight</h1>
  </div>

  <div class="scroll" style="margin-top:8px">
    <div class="field"><label class="fl" for="f-student">STUDENT</label><input type="text" id="f-student" autocomplete="off" placeholder="Name"></div>
    <div class="row" style="gap:10px;align-items:flex-end">
      <div class="field sp"><label class="fl" for="f-aircraft">AIRCRAFT</label><input type="text" id="f-aircraft" autocomplete="off" placeholder="C172S · N7214G"></div>
      <div class="field" style="flex:0 0 124px"><label class="fl" for="f-hobbs-start">HOBBS START</label><input type="text" id="f-hobbs-start" inputmode="decimal" autocomplete="off" placeholder="1234.5"></div>
    </div>
    <div class="field">
      <label class="fl" for="f-course">TASK LIBRARY</label>
      <select id="f-course">
        <optgroup label="Certificates &amp; ratings">
          <option value="ppl">Private Pilot — Airplane (ACS-6C)</option>
          <option value="instrument">Instrument Rating — Airplane (ACS-8C)</option>
          <option value="commercial">Commercial — Airplane (ACS-7B)</option>
        </optgroup>
        <optgroup label="Currency">
          <option value="ipc">Instrument Proficiency Check (§ 61.57(d))</option>
          <option value="review">Flight Review (§ 61.56)</option>
        </optgroup>
        <optgroup label="Instructor">
          <option value="cfi">Flight Instructor — Airplane (ACS-25)</option>
          <option value="cfii">Flight Instructor Instrument (8081-9E)</option>
        </optgroup>
      </select>
    </div>

    <div class="row" style="margin-top:18px;align-items:baseline">
      <span class="eyebrow sp">MANEUVER QUEUE · <span id="pickCount" style="color:var(--warn)">0</span></span>
      <button class="link" id="allPicks" style="color:var(--go);margin-right:14px">All</button>
      <button class="link" id="clearPicks">Clear</button>
    </div>
    <div class="card" id="taskPicker" style="margin-top:8px"></div>
    <div style="height:12px"></div>
  </div>

  <button class="primary noprint" id="startBtn" style="min-height:58px;margin-top:12px;flex:none">
    <span class="big" style="font-size:23px">Start grading</span>
  </button>
</section>

<!-- ARMED -->
<!-- GRADE -->
<section id="v-grade" hidden>
  <div class="topbar">
    <button id="jumpBtn" style="flex:1 1 auto;border:0;background:none;padding:0;min-height:44px;display:flex;align-items:center;gap:7px;color:inherit;text-align:left">
      <span class="eyebrow" id="gradeCount">MANEUVER 1 OF 6</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--go)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="link" id="endEarly" style="flex:none">End &amp; close out</button>
  </div>
  <div class="bar" id="gradeBar" style="margin-top:2px"></div>

  <div style="margin-top:16px;flex:none">
    <div class="eyebrow" style="color:var(--go)" id="attemptLabel">NOT YET GRADED</div>
    <h1 class="d" style="font-size:46px;margin-top:5px;color:var(--ink)" id="gradeName">&mdash;</h1>

/* ---------- the live queue ----------
   A maneuver marked not flown stays in the record but leaves the lesson:
   navigation steps over it, the queue count re-bases, and the debrief shows
   it as a footnote instead of a row. c.idx still indexes the full array, so
   these map between the two rather than filtering it. */
function isFlown(e){ return !e || !e.skipped; }
function liveList(c){
  var o=[],i; for(i=0;i<c.entries.length;i++){ if(isFlown(c.entries[i])) o.push(i); }
  return o;
}
function livePos(c){
  var L=liveList(c),i; for(i=0;i<L.length;i++){ if(L[i]===c.idx) return i+1; }
  return 0;
}
function stepLive(c,from,dir){
  var i=from+dir;
  while(i>=0 && i<c.entries.length){ if(isFlown(c.entries[i])) return i; i+=dir; }
  return -1;
}
/* c.idx can be left sitting on a maneuver that was just dropped; move to the
   nearest live one. False means every maneuver is dropped and there is
   nothing left to grade. */
function anchorLive(c){
  if(isFlown(c.entries[c.idx])) return true;
  var f=stepLive(c,c.idx,1);
  if(f<0) f=stepLive(c,c.idx,-1);
  if(f<0) return false;
  c.idx=f; return true;
}

function taskById(libKey,id){
  var lib=LIB[libKey]; if(!lib) return null;
  for(var a=0;a<lib.areas.length;a++){
    var ts=lib.areas[a].tasks;
    for(var i=0;i<ts.length;i++){ if(ts[i].id===id) return ts[i]; }
  }
  return null;
}

/* ---------- instructor and currency libraries ----------
   Built after LIB, and after taskById, so each one can reuse task definitions
   already verified against the Private, Commercial and Instrument ACS instead
   of restating their limits. Area and task names are verbatim from the FAA
   document named in each label. ASES/AMES and AMEL/AMES tasks are omitted:
   these are ASEL libraries.

   Three builders, and which one a task gets is the honest answer to "where
   does this number come from":
     DT()  reuses a verified task's tolerance, and adds instructional causes
     GT()  a ground or oral task, which has no numeric tolerance to show
     DEMO() an in-flight demonstration with no counterpart anywhere already
          verified, so it shows what is being asked for rather than a number */
var TEACH  = ["Explanation while flying","Division of attention","Common errors not covered"];
var GROUND = ["Instructional knowledge","Depth of knowledge","Explanation clarity","Common errors not covered"];

function AREA(name,tasks){ return {name:name,tasks:tasks}; }
function GT(id,name){ return {id:id,name:name,tol:["—"],why:GROUND.slice()}; }
function DEMO(id,name,why){ return {id:id,name:name,tol:["Demonstrate + explain"],
                                  why:(why||[]).concat(TEACH).concat(CAUSE)}; }
function DT(libKey,id,name){
  var t=taskById(libKey,id);
  if(!t) return GT(id,name||id);
  return {id:id,name:name||t.name,tol:t.tol,why:t.why.concat(TEACH)};
}
/* a verified task carried over unchanged — same limits, same causes */
function RT(libKey,id,name){
  var t=taskById(libKey,id);
  if(!t) return GT(id,name||id);
  return name ? {id:id,name:name,tol:t.tol,why:t.why} : t;
}

/* swipe a row left to uncover its Delete; hover or keyboard focus uncovers it too */
function attachSwipe(wrap){
  var inner=wrap.querySelector(".sw-in");
  var x0=0,y0=0,drag=false,dx=0;
  inner.addEventListener("touchstart",function(e){
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; drag=true; dx=0;
    inner.style.transition="none";
  },{passive:true});
  inner.addEventListener("touchmove",function(e){
    if(!drag) return;
    var ddx=e.touches[0].clientX-x0, ddy=e.touches[0].clientY-y0;
    if(Math.abs(ddy)>Math.abs(ddx)){ drag=false; inner.style.transition=""; inner.style.transform=""; return; }
    dx=Math.max(Math.min(ddx,0),-96);
    inner.style.transform="translateX("+dx+"px)";
  },{passive:true});
  inner.addEventListener("touchend",function(){
    if(!drag) return;
    drag=false; inner.style.transition=""; inner.style.transform="";
    if(dx<-48) wrap.classList.add("open"); else wrap.classList.remove("open");
  });
}

/* entry = one maneuver in this flight */
function entryResult(e){
  if(e.skipped) return "no";
  return e.result || null;
}
function allWhy(e){ return e.why || []; }
function allNotes(e){ return e.notes || []; }

/* Flights recorded under the old attempt model are rewritten in place the
   first time they are loaded: the grade it computed becomes the grade, every
   attempt note becomes a note, causes merge. */
function migrateEntry(e){
  if(!e || !e.attempts) return e;
  var r=null, why=[], seen={}, notes=[], i, j, a, w;
  if(e.attempts.length){
    r="sat";
    for(i=0;i<e.attempts.length;i++){ if(e.attempts[i].result==="unsat") r="unsat"; }
  }
  for(i=0;i<e.attempts.length;i++){
    a=e.attempts[i];
    w=a.why||[];
    for(j=0;j<w.length;j++){ if(!seen[w[j]]){ seen[w[j]]=1; why.push(w[j]); } }
    if(a.note) notes.push(a.note);
  }
  if(e.note) notes.push(e.note);
  e.result=r; e.why=why; e.notes=notes;
  delete e.attempts; delete e.note;
  return e;
}
function migrateFlight(f){
  if(!f || !f.entries) return f;
  for(var i=0;i<f.entries.length;i++) migrateEntry(f.entries[i]);
  return f;
}
function migrateAll(){
  migrateFlight(S.current);
  for(var i=0;i<S.flights.length;i++) migrateFlight(S.flights[i]);
}

/* ---------- quote of the launch ----------
   A shuffle bag: every quote shows once before any repeats, and the bag never
   re-opens on the same quote it just closed with. */
function drawQuote(){
  var bag = Array.isArray(S.bag) ? S.bag.slice() : [];
  if(!bag.length){
    for(var i=0;i<QUOTES.length;i++) bag.push(i);
    for(var j=bag.length-1;j>0;j--){
      var k=Math.floor(Math.random()*(j+1)), t=bag[j]; bag[j]=bag[k]; bag[k]=t;
    }
    if(bag.length>1 && S.lastQuote!==null && bag[bag.length-1]===S.lastQuote){
      var swap=bag[bag.length-1]; bag[bag.length-1]=bag[0]; bag[0]=swap;
    }
  }
  var idx=bag.pop();
  S.bag=bag; S.lastQuote=idx; save();
  return QUOTES[idx] || QUOTES[0];
}

  var live=liveList(c);
  $("gradeCount").textContent="MANEUVER "+livePos(c)+" OF "+live.length;
  fitName($("gradeName"), t?t.name:"\u2014", r?40:46);

  var lab=$("attemptLabel");
  if(r==="sat"){ lab.textContent="SATISFACTORY"; lab.style.color="var(--sat)"; }
  else if(r==="unsat"){ lab.textContent="UNSATISFACTORY"; lab.style.color="var(--warn)"; }
  else { lab.textContent="NOT YET GRADED"; lab.style.color="var(--go)"; }

  var tol=$("gradeTol"); tol.innerHTML="";
  /* a ground or oral task has no limit to print; one orphan em dash in a
     chip reads as a rendering fault rather than as "no numeric tolerance" */
  if(t && !(t.tol.length===1 && t.tol[0]==="\u2014")){
    for(var i=0;i<t.tol.length;i++){ tol.appendChild(el("span","chip",t.tol[i])); }
  }

  var bar=$("gradeBar"); bar.innerHTML="";
  bar.style.gridTemplateColumns="repeat("+Math.max(live.length,1)+",minmax(0,1fr))";
  for(var k=0;k<live.length;k++){
    var sp=el("span"), rk=entryResult(c.entries[live[k]]);
    if(live[k]===c.idx) sp.className="now";
    else if(rk==="unsat") sp.className="bad";
    else if(rk==="sat") sp.className="done";
    bar.appendChild(sp);
  }

  var nu=$("nextUp"), nxt=stepLive(c,c.idx,1);
  if(nxt>=0){
    var nt=taskById(c.libKey,c.entries[nxt].taskId);
    nu.textContent="NEXT UP \u00b7 "+((nt?nt.name:"\u2014").toUpperCase());
  } else nu.textContent="LAST MANEUVER IN THE QUEUE";
  nu.hidden=false;

  drawStandards(e,t,r);
  drawNotes(e);

  /* the chosen grade stays bright, the other recedes — both stay pressable,
     so changing your mind is one tap and needs no separate undo */
  $("v-grade").classList.toggle("graded", !!r);
  var satB=document.querySelector("#v-grade .grade.sat");
  var unsB=document.querySelector("#v-grade .grade.unsat");
  satB.classList.toggle("picked", r==="sat");
  satB.classList.toggle("dim", r==="unsat");
  unsB.classList.toggle("picked", r==="unsat");
  unsB.classList.toggle("dim", r==="sat");
  satB.querySelector(".sub").textContent = (r==="sat") ? "tap again to clear" : "tap to grade";
  paintUnsatSub(e);

  $("prevBtn").disabled=(stepLive(c,c.idx,-1)<0);

  /* there is no next on the last maneuver; make the button the way out
     instead of a control that only fires a toast telling you to use another */
  var last=(nxt<0), nb=$("nextBtn");
  $("nextLabel").textContent = last ? "Close out" : "Next";
  nb.classList.toggle("end", last);
  nb.classList.toggle("strong", !last);
}

/* the standards picker, inline. It fills the empty middle of the maneuver
   screen rather than taking one of its own, so grading never navigates. */
function drawStandards(e,t,r){
  var head=$("stdHead"), grid=$("stdGrid");
  grid.innerHTML="";
  var show=(r==="unsat" && t && t.why && t.why.length);
  head.hidden=!show; grid.hidden=!show;
  if(!show) return;
  if(!e.why) e.why=[];
  for(var i=0;i<t.why.length;i++){
    (function(w){
      var b=el("button","why"); b.type="button";
      b.setAttribute("aria-pressed", e.why.indexOf(w)>=0?"true":"false");
      b.appendChild(el("span","n",w));
      var lim=matchLimit(t,w);
      if(lim) b.appendChild(el("span","lim",lim));
      b.addEventListener("click",function(){
        var k=e.why.indexOf(w);
        if(k>=0) e.why.splice(k,1); else e.why.push(w);
        b.setAttribute("aria-pressed", e.why.indexOf(w)>=0?"true":"false");
        save(); paintUnsatSub(e);
      });
      grid.appendChild(b);
    })(t.why[i]);
  }
}
function paintUnsatSub(e){
  var n=(e.why||[]).length;
  var sub=document.querySelector("#v-grade .grade.unsat .sub");
  if(!sub) return;
  sub.textContent = (e.result==="unsat")
    ? (n ? n+(n===1?" standard not met":" standards not met") : "no standards recorded")
    : "standards not met";
}

/* ---------- jump sheet: switch maneuvers, or add one mid-flight ---------- */
function openJump(){
  var c=S.current; if(!c) return;
  var wrap=el("div","sheet"), inner=el("div","inner");
  var head=el("div","row"); head.style.cssText="flex:none;margin-bottom:10px;align-items:baseline";
  var h=el("div","d"); h.style.cssText="font-size:24px;color:var(--ink)"; h.textContent="Jump to";
  var sub=el("div","eyebrow sp"); sub.style.textAlign="right";
  function ungraded(){
    var n=0,u; for(u=0;u<c.entries.length;u++){
      if(isFlown(c.entries[u]) && !entryResult(c.entries[u])) n++;
    }
    return n;
  }
  sub.textContent=ungraded()+" LEFT";
  head.appendChild(h); head.appendChild(sub);
  var list=el("div","list");
  inner.appendChild(head); inner.appendChild(list);

  var dirty=false;
  function close(){
    if(wrap.parentNode) wrap.parentNode.removeChild(wrap);
    /* dropping maneuvers re-bases the count and can move you off the one you
       were sitting on, so the screen behind must not keep showing the old
       queue — including when the sheet is dismissed by tapping the backdrop */
    if(dirty && S.current) renderGrade();
  }
  function changed(){ dirty=true; save(); drawQueue(); }

  function drawQueue(){
    list.innerHTML="";
    sub.textContent=ungraded()+" LEFT";
    /* weather rarely takes one maneuver; it takes the rest of the lesson */
    var ug=ungraded();
    if(ug>1){
      var da=el("button","ghost dropall","Drop all "+ug+" ungraded");
      da.type="button";
      da.addEventListener("click",function(){
        openConfirm("Drop "+ug+" ungraded maneuvers?",
          "They move to not flown and leave the debrief. Nothing graded is touched, and you can restore any of them here.",
          function(){
            for(var q=0;q<c.entries.length;q++){
              var en=c.entries[q];
              if(isFlown(en) && !entryResult(en)) en.skipped=true;
            }
            changed(); toast("Marked not flown");
          },"Drop all");
      });
      list.appendChild(da);
    }
    for(var i=0;i<c.entries.length;i++){
      (function(e,i){
        var t=taskById(c.libKey,e.taskId), r=entryResult(e);
        var b=el("button","jr"+(i===c.idx?" now":""));
        var dropped=!isFlown(e);
        var tg=el("span","tag "+(r||"no"), r==="sat"?"SAT":r==="unsat"?"UNSAT":e.skipped?"N/O":"—");
        if(!r && !e.skipped){ tg.style.cssText="flex:none;min-width:0;width:18px;text-align:center;background:none;border:0;color:var(--ink-2);font-family:var(--mono);font-size:15px"; }
        var sp=el("span","sp");
        var nm=el("span","nm",t?t.name:"—");
        var tlim=t?t.tol.join(" · "):"";
        var tl=el("span","tl", tlim==="—" ? "" : tlim);
        sp.appendChild(nm); sp.appendChild(tl);
        b.appendChild(tg); b.appendChild(sp);
        if(i===c.idx){ var here=el("span","mono","HERE"); here.style.cssText="font-size:10px;font-weight:600;color:var(--go);letter-spacing:.8px"; b.appendChild(here); }
        b.addEventListener("click",function(){
          /* tapping a dropped row puts it back rather than jumping to a
             maneuver that is not in the lesson any more */
          if(!isFlown(e)){ e.skipped=false; changed(); return; }
          c.idx=i; save(); close(); renderGrade(); show("grade");
        });

        /* swipe to drop, swipe again to restore — the same gesture the home
           screen and the note rows already use */
        var wrap=el("div","swipe jrow"+(dropped?" gone":""));
        var del=el("button","sw-del"); del.type="button";
        del.textContent=dropped?"Restore":"Drop";
        var inner=el("div","sw-in"); inner.appendChild(b);
        wrap.appendChild(del); wrap.appendChild(inner);
        del.addEventListener("click",function(){
          if(!isFlown(e)){ e.skipped=false; changed(); return; }
          /* an ungraded maneuver costs nothing to drop; a graded one would
             take a real result off the student's debrief, so it asks */
          if(entryResult(e)){
            openConfirm("Drop a graded maneuver?",
              (t?t.name:"This maneuver")+" is graded "+(entryResult(e)==="sat"?"satisfactory":"unsatisfactory")+
              ". Dropping it takes that result off the debrief. The grade is kept, so you can restore it.",
              function(){ e.skipped=true; changed(); toast("Marked not flown"); },
              "Drop");
            return;
          }
          e.skipped=true; changed();
        });
        attachSwipe(wrap);
        list.appendChild(wrap);
      })(c.entries[i],i);
    }
  }

  function drawAdd(){
    list.innerHTML="";
    h.textContent="Add maneuver";
    var lib=LIB[c.libKey], have={}, any=false;
    for(var q=0;q<c.entries.length;q++){ have[c.entries[q].taskId]=1; }
    for(var a=0;a<lib.areas.length;a++){
      var area=lib.areas[a], shown=false;
      for(var i=0;i<area.tasks.length;i++){
        var t=area.tasks[i];
        if(have[t.id]) continue;
        if(!shown){ var ah=el("div","areahead",area.name); ah.style.margin="0 -16px"; list.appendChild(ah); shown=true; }
        any=true;
        (function(t){
          var b=el("button","jr");
          var sp=el("span","sp");
          sp.appendChild(el("span","nm",t.name));
          sp.appendChild(el("span","tl",t.tol.join(" · ")));
          var plus=el("span","mono","ADD"); plus.style.cssText="font-size:10px;font-weight:600;color:var(--go);letter-spacing:.8px";
          b.appendChild(sp); b.appendChild(plus);
          b.addEventListener("click",function(){
            c.entries.push({ taskId:t.id, result:null, why:[], notes:[], skipped:false });
            c.idx=c.entries.length-1; save(); close(); renderGrade(); show("grade");
            toast(t.name+" added");
          });
          list.appendChild(b);
        })(area.tasks[i]);
      }
    }
    if(!any) list.appendChild(el("div","note","Every maneuver in this library is already in the queue."));
    addBtn.textContent="Back to queue";
    addBtn.onclick=function(){ h.textContent="Jump to"; drawQueue(); addBtn.textContent="Add a maneuver"; addBtn.onclick=drawAdd; };
  }

  var foot=el("div","row"); foot.style.cssText="flex:none;margin-top:12px;gap:10px";
  var addBtn=el("button","ghost sp","Add a maneuver");
  addBtn.onclick=drawAdd;
  var timeBtn=el("button","ghost","Times");
  timeBtn.addEventListener("click",function(){ close(); openTimes(); });
  var cancel=el("button","ghost","Close");
  cancel.addEventListener("click",close);
  foot.appendChild(addBtn); foot.appendChild(timeBtn); foot.appendChild(cancel);
  inner.appendChild(foot);

  drawQueue();
  wrap.appendChild(inner); document.body.appendChild(wrap);
  wrap.addEventListener("click",function(ev){ if(ev.target===wrap) close(); });
}

document.querySelectorAll("#v-grade [data-grade]").forEach(function(btn){
  btn.addEventListener("click",function(){
    var c=S.current, e=c.entries[c.idx];
    var g=btn.getAttribute("data-grade");
    var was=e.result;

    /* With the picker inline there is nowhere to route to, so UNSAT toggles
       exactly like SAT and the standards clear with the grade. */
    if(g==="unsat"){
      if(was==="unsat"){
        e.result=null; e.why=[]; e.skipped=false;
        save(); renderGrade(); toast("Grade cleared");
        return;
      }
      e.skipped=false; e.result="unsat";
      c.lastGraded=c.idx; save(); renderGrade();
      return;
    }

    /* SAT toggles: pressing it again clears the grade, and an ungraded
       maneuver is resolved as not flown at close-out. Notes survive. */
    if(was==="sat"){
      e.result=null; e.skipped=false;
      save(); renderGrade(); toast("Grade cleared");
      return;
    }

    e.skipped=false; e.result="sat";
    /* standards recorded against an unsat make no sense once it reads sat */
    if(was==="unsat" && (e.why||[]).length){ e.why=[]; toast("Standards cleared"); }
    c.lastGraded=c.idx;
    save(); renderGrade();
  });
});

  row.appendChild(cancel); row.appendChild(ok);

/* ---------- WHY ---------- */
/* show the ACS limit on a cause when one of the task's tolerance chips names it */
function matchLimit(t,why){
  var w=why.toLowerCase().split(" ")[0];
  for(var i=0;i<t.tol.length;i++){
    var s=t.tol[i].toLowerCase();
    if(w.length>3 && s.indexOf(w)>=0) return t.tol[i];
    if(w==="altitude" && (s.indexOf("alt")===0||s.indexOf("agl")>=0||s.indexOf("mda")>=0)) return t.tol[i];
    if(w==="airspeed" && (s.indexOf("ias")>=0||s.indexOf("vy")>=0||s.indexOf("vx")>=0||s.indexOf("glide")>=0||s.indexOf("vso")>=0)) return t.tol[i];
    if(w==="heading" && s.indexOf("hdg")>=0) return t.tol[i];
    if(w==="bank" && s.indexOf("bank")>=0) return t.tol[i];
    if(w==="touchdown" && s.indexOf("beyond")>=0) return t.tol[i];
    if(w==="rollout" && s.indexOf("rollout")>=0) return t.tol[i];
    if(w==="course" && s.indexOf("cdi")>=0) return t.tol[i];
  }
  return "";
}

/* ---------- Hobbs and instruction time ----------
   The aircraft figure and the added time are kept and shown apart. A single
   combined number on a debrief gets transcribed into a logbook's flight-time
   column, and added ground time does not belong there. */
function tnum(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
function r1(n){ return Math.round(n*10)/10; }
function hobbsUsed(c){
  var a=tnum(c.hobbsStart), b=tnum(c.hobbsEnd);
  if(a===null||b===null||b<a) return null;
  return r1(b-a);
}
function addedTime(c){ var n=tnum(c.addTime); return n&&n>0 ? r1(n) : 0; }
function timeLine(c){
  if(!c) return "";
  var h=hobbsUsed(c), add=addedTime(c), p=[];
  if(h===null && !add) return "";
  if(h!==null) p.push(h.toFixed(1)+" Hobbs");
  if(add) p.push("+"+add.toFixed(1));
  p.push(((h===null?0:h)+add).toFixed(1)+" total instruction");
  return p.join("  \u00b7  ");
}
function hobbsWarning(c){
  var a=tnum(c.hobbsStart), b=tnum(c.hobbsEnd);
  if(a!==null && b!==null && b<a) return "Hobbs end is before Hobbs start.";
  if(a===null && b!==null) return "No Hobbs start recorded.";
  return "";
}

/* ---------- CLOSE OUT ---------- */
function renderClose(){
  libTheme();
  var c=S.current; if(!c) return;
  $("closeMeta").textContent=(c.student||"Flight")+(c.aircraft?" · "+c.aircraft:"")+" · "+fmtDate(c.date);
  var sat=0,uns=0,no=0;
  var list=$("closeList"); list.innerHTML="";
  for(var i=0;i<c.entries.length;i++){
    (function(e,i){
      var t=taskById(c.libKey,e.taskId), r=entryResult(e);
      if(r==="sat")sat++; else if(r==="unsat")uns++; else no++;
      var b=el("button","rowitem");
      var tg=el("span","tag "+(r||"no"), r==="sat"?"SAT":r==="unsat"?"UNSAT":"N/O");
      var sp=el("span","sp");
      var n=el("span",null,t?t.name:"—"); n.style.display="block"; n.style.fontWeight="600"; n.style.fontSize="15px";
      var detail=[];
      var w=allWhy(e); if(w.length) detail.push(w.join(", "));
      var nn=allNotes(e).length; if(nn) detail.push(nn+(nn===1?" note":" notes"));
      if(r==="no") detail.push("not flown");
      var s=el("span","muted",detail.join(" · ")); s.style.display="block"; s.style.fontSize="13px"; s.style.marginTop="2px";
      sp.appendChild(n); sp.appendChild(s);
      b.appendChild(tg); b.appendChild(sp);
      b.addEventListener("click",function(){ c.idx=i; save(); renderGrade(); show("grade"); });
      list.appendChild(b);
    })(c.entries[i],i);
  }
  $("cSat").textContent=String(sat); $("cUnsat").textContent=String(uns); $("cNo").textContent=String(no);
  $("f-summary").value=c.summary||"";
  $("f-hobbs-start2").value=c.hobbsStart||"";
  $("f-hobbs-end").value=c.hobbsEnd||"";
  paintTimes();
}

function buildTodo(c){
  var out=[];
  for(var i=0;i<c.entries.length;i++){
    var e=c.entries[i], t=taskById(c.libKey,e.taskId), r=entryResult(e);
    if(r==="unsat"){
      var w=allWhy(e);
      out.push("Re-fly "+(t?t.name:"the maneuver")+(w.length?" — focus on "+w.join(", ").toLowerCase():"")+".");
    }
  }
  /* not-flown maneuvers are named once in the scorecard footnote; a line
     each would put the clutter straight back under a different heading */
  var nf=[];
  for(var k=0;k<c.entries.length;k++){
    if(!isFlown(c.entries[k])){
      var tk=taskById(c.libKey,c.entries[k].taskId);
      nf.push(tk?tk.name:"the maneuver");
    }
  }
  if(nf.length) out.push("Fly next lesson: "+nf.join(", ")+" — not flown today.");
  return out;
}

function debriefText(){
  var c=S.current, lib=LIB[c.libKey], L=[];
  L.push("FLIGHT DEBRIEF — "+(c.student||"Student"));
  L.push(fmtDate(c.date)+" · "+(c.aircraft||"—")+" · "+lib.label+" ("+lib.acs+")");
  var tl=timeLine(c); if(tl) L.push(tl);

  L.push(""); L.push("SCORECARD");
  for(var i=0;i<c.entries.length;i++){
    var e=c.entries[i], t=taskById(c.libKey,e.taskId), r=entryResult(e);
    var line="• "+(t?t.name:"—")+" — "+(r==="sat"?"SAT":r==="unsat"?"UNSAT":"NOT FLOWN");
    var w=allWhy(e); if(w.length) line+=" — standards not met: "+w.join(", ");
    if(r==="unsat"&&t) line+=" [limit: "+t.tol.join(" · ")+"]";
    L.push(line);
    var notes=allNotes(e);
    for(var n=0;n<notes.length;n++){ L.push("    note: "+notes[n]); }

    for(var q=0;q<todo.length;q++){ L.push((q+1)+". "+todo[q]); } }
  L.push(""); L.push("Graded against "+lib.acs+". Training record, not a certification result.");

function logbookText(){
  var c=S.current, lib=LIB[c.libKey], names=[], weak=[], notflown=[];
  for(var i=0;i<c.entries.length;i++){
    var e=c.entries[i], t=taskById(c.libKey,e.taskId); if(!t) continue;

}

function copy(text,label){

    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";

  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(label+" copied"); }, fallback);
    } else fallback();
  }catch(e){ fallback(); }
}

/* ---------- debrief as a shareable image ----------
   Drawn straight onto a canvas: no library, so it still works with no signal,
   and the output is pixel-identical every time. Two passes over the same
   content — one to measure the height, one to paint. */

var IMG_SCALE = 2;              /* output is 2x the logical layout */
var IMG_LW    = 540;            /* logical width  -> 1080px png */
var IMG_PAD   = 34;

function cssVar(n){
  try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  catch(e){ return ""; }
}
function fontStack(){
  var ok = document.fonts && document.fonts.check && document.fonts.check('800 20px Archivo');
  return ok ? "Archivo, system-ui, sans-serif" : "system-ui, -apple-system, sans-serif";
}
function monoStack(){
  var ok = document.fonts && document.fonts.check && document.fonts.check('600 20px "IBM Plex Mono"');
  return ok ? '"IBM Plex Mono", ui-monospace, monospace' : "ui-monospace, Menlo, monospace";
}

function rr(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* canvas has no letter-spacing; draw it a character at a time */
function spaced(ctx, text, x, y, sp){
  for (var i = 0; i < text.length; i++){
    ctx.fillText(text[i], x, y);
    x += ctx.measureText(text[i]).width + sp;
  }
}
function spacedWidth(ctx, text, sp){
  var w = 0;
  for (var i = 0; i < text.length; i++) w += ctx.measureText(text[i]).width + sp;
  return w - sp;
}

function debriefImageCanvas(cb){
  var c = S.current, lib = LIB[c.libKey];
  var F = fontStack(), M = monoStack();
  var GO = cssVar("--go") || "#B6F34A";
  var INK = "#F4F4F4", INK2 = "#9B9B9B", LINE = "#2C2C2C";
  var SAT = "#B6F34A", WARN = "#FF8A3D", SURF = "#15150F";

  var meas = document.createElement("canvas").getContext("2d");
  var inner = IMG_LW - IMG_PAD * 2;

  function wrap(text, font, maxw){
    meas.font = font;
    var words = String(text).split(/\s+/), lines = [], cur = "";
    for (var i = 0; i < words.length; i++){
      var t = cur ? cur + " " + words[i] : words[i];
      if (meas.measureText(t).width > maxw && cur){ lines.push(cur); cur = words[i]; }
      else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* tally once, used by the stat tiles */
  var nSat = 0, nUns = 0, nNo = 0;
  for (var i = 0; i < c.entries.length; i++){
    var r0 = entryResult(c.entries[i]);
    if (r0 === "sat") nSat++; else if (r0 === "unsat") nUns++; else nNo++;
  }
  var todo = buildTodo(c);

  /* one walk over the content; ctx null = measure only */
  function walk(ctx){
    var y = IMG_PAD;
    var x = IMG_PAD;

    function text(str, font, color, size, lh, maxw){
      var lines = wrap(str, font, maxw || inner);
      if (ctx){
        ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = "alphabetic";
        for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], x, y + size + i * lh);
      }
      y += size + (lines.length - 1) * lh;
      return lines.length;
    }

    /* wordmark */
    if (ctx){
      ctx.font = "800 13px " + F; ctx.fillStyle = GO;
      spaced(ctx, "DEBRIEF", x, y + 13, 2.4);
    }
    y += 13 + 20;

    /* student */
    text(c.student || "Student", "800 31px " + F, INK, 31, 36);
    y += 9;

    /* meta line */
    if (ctx){
      ctx.font = "600 12px " + M; ctx.fillStyle = INK2;
      ctx.fillText(fmtDate(c.date) + "  ·  " + (c.aircraft || "—"), x, y + 12);
    }
    y += 12 + 5;
    if (ctx){
      ctx.font = "600 12px " + M; ctx.fillStyle = INK2;
      ctx.fillText(lib.label, x, y + 12);
    }
    y += 12 + 16;

    /* the receipt half of the debrief: what was done and how long it took */
    var tline = timeLine(c);
    if (tline){
      y -= 9;
      if (ctx){
        ctx.font = "600 12px " + M; ctx.fillStyle = GO;
        ctx.fillText(tline, x, y + 12);
      }
      y += 12 + 13;
    }

    /* accent rule */
    if (ctx){ ctx.fillStyle = GO; ctx.fillRect(x, y, inner, 2.5); }
    y += 2.5 + 20;

    /* stat tiles */
    var tiles = [[nSat, "SAT", SAT], [nUns, "UNSAT", nUns ? WARN : INK2], [nNo, "NOT FLOWN", INK2]];
    var gap = 9, tw = (inner - gap * 2) / 3, th = 66;
    if (ctx){
      for (var t = 0; t < 3; t++){
        var tx = x + t * (tw + gap);
        ctx.fillStyle = "#121212"; rr(ctx, tx, y, tw, th, 12); ctx.fill();
        ctx.strokeStyle = LINE; ctx.lineWidth = 1; rr(ctx, tx + .5, y + .5, tw - 1, th - 1, 12); ctx.stroke();
        ctx.font = "800 27px " + F; ctx.fillStyle = tiles[t][2]; ctx.textAlign = "center";
        ctx.fillText(String(tiles[t][0]), tx + tw / 2, y + 34);
        ctx.font = "600 9.5px " + M; ctx.fillStyle = INK2;
        var lw = spacedWidth(ctx, tiles[t][1], 1.1);
        spaced(ctx, tiles[t][1], tx + tw / 2 - lw / 2, y + 51, 1.1);
        ctx.textAlign = "left";
      }
    }
    y += th + 22;

    function heading(str){
      if (ctx){
        ctx.font = "800 11px " + F; ctx.fillStyle = GO;
        spaced(ctx, str, x, y + 11, 2);
      }
      y += 11 + 12;
    }

    /* instructor summary */
    if (c.summary){
      var sLines = wrap(c.summary, "400 14.5px " + F, inner - 28);
      var boxH = 20 + 11 + 10 + sLines.length * 20 + 18;
      if (ctx){
        ctx.fillStyle = SURF; rr(ctx, x, y, inner, boxH, 13); ctx.fill();
        ctx.strokeStyle = "#232318"; ctx.lineWidth = 1; rr(ctx, x + .5, y + .5, inner - 1, boxH - 1, 13); ctx.stroke();
        ctx.font = "600 9.5px " + M; ctx.fillStyle = GO;
        spaced(ctx, "FROM YOUR INSTRUCTOR", x + 14, y + 22, 1.1);
        ctx.font = "400 14.5px " + F; ctx.fillStyle = INK;
        for (var s = 0; s < sLines.length; s++) ctx.fillText(sLines[s], x + 14, y + 44 + s * 20);
      }
      y += boxH + 22;
    }

    /* scorecard */
    heading("SCORECARD");
    var imgRows = [];
    for (var kq = 0; kq < c.entries.length; kq++){
      if (isFlown(c.entries[kq])) imgRows.push(kq);
    }
    for (var ri = 0; ri < imgRows.length; ri++){
      var k = imgRows[ri];
      var e = c.entries[k], tk = taskById(c.libKey, e.taskId), r = entryResult(e);
      var label = r === "sat" ? "SAT" : r === "unsat" ? "UNSAT" : "N/O";
      var col   = r === "sat" ? SAT  : r === "unsat" ? WARN   : INK2;

      meas.font = "600 10px " + M;
      var chipW = spacedWidth(meas, label, 1.1) + 18;
      var nameW = inner - chipW - 12;

      var nLines = wrap(tk ? tk.name : "—", "700 15px " + F, nameW);
      var top = y;

      if (ctx){
        ctx.font = "700 15px " + F; ctx.fillStyle = INK;
        for (var n = 0; n < nLines.length; n++) ctx.fillText(nLines[n], x, y + 15 + n * 19);
      }

      /* result chip, right aligned on the first line */
      if (ctx){
        ctx.globalAlpha = (r === "sat" || r === "unsat") ? 1 : .5;
        ctx.fillStyle = col; rr(ctx, x + inner - chipW, top + 2, chipW, 19, 5); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.font = "600 10px " + M; ctx.fillStyle = (r === "sat" || r === "unsat") ? "#0A0F04" : "#F4F4F4";
        spaced(ctx, label, x + inner - chipW + 9, top + 15.5, 1.1);
      }
      y += 15 + (nLines.length - 1) * 19 + 5;

      /* what was observed */
      var bits = [];
      var w = allWhy(e);
      if (w.length) bits.push("Standards not met: " + w.join(", "));
      if (tk && r === "unsat") bits.push("limit: " + tk.tol.join(" · "));
      if (r === "sat") bits.unshift("inside tolerance");
      if (r !== "sat" && r !== "unsat") bits = ["not flown this lesson"];

      var obs = bits.join("  ·  ") || "—";
      var oLines = wrap(obs, "400 12.5px " + M, inner);
      if (ctx){
        ctx.font = "400 12.5px " + M; ctx.fillStyle = INK2;
        for (var o = 0; o < oLines.length; o++) ctx.fillText(oLines[o], x, y + 12.5 + o * 17);
      }
      y += 12.5 + (oLines.length - 1) * 17 + 8;

      /* notes get their own weight — they carry the credit for a good re-fly,
         and grey text under an orange tag never gets read */
      var notes = allNotes(e);
      for (var nn = 0; nn < notes.length; nn++){
        var nLines2 = wrap(notes[nn], "400 13px " + F, inner - 12);
        if (ctx){
          ctx.fillStyle = GO;
          ctx.fillRect(x, y + 2, 2, nLines2.length * 18 - 4);
          ctx.font = "400 13px " + F; ctx.fillStyle = INK;
          for (var q2 = 0; q2 < nLines2.length; q2++) ctx.fillText(nLines2[q2], x + 12, y + 13 + q2 * 18);
        }
        y += nLines2.length * 18 + 4;
      }
      y += 8;

      if (ri < imgRows.length - 1){
        if (ctx){ ctx.fillStyle = "#1A1A1A"; ctx.fillRect(x, y - 7, inner, 1); }
      }
    }
    y += 10;

    /* homework */
    if (todo.length){
      heading("BEFORE THE NEXT LESSON");
      for (var q = 0; q < todo.length; q++){
        var tLines = wrap(todo[q], "400 14px " + F, inner - 30);
        if (ctx){
          ctx.fillStyle = "#2A1507"; rr(ctx, x, y + 1, 20, 20, 10); ctx.fill();
          ctx.font = "600 11px " + M; ctx.fillStyle = WARN; ctx.textAlign = "center";
          ctx.fillText(String(q + 1), x + 10, y + 15);
          ctx.textAlign = "left";
          ctx.font = "400 14px " + F; ctx.fillStyle = INK;
          for (var z = 0; z < tLines.length; z++) ctx.fillText(tLines[z], x + 30, y + 15 + z * 19);
        }
        y += Math.max(21, 15 + (tLines.length - 1) * 19) + 11;
      }
      y += 6;
    }

    /* footer */
    if (ctx){ ctx.fillStyle = LINE; ctx.fillRect(x, y, inner, 1); }
    y += 1 + 14;
    var fLines = wrap("Graded against " + lib.acs + ". Tolerances are the ACS limits for each task. "
                      + "This debrief is a training record, not a certification result.",
                      "400 11px " + M, inner);
    if (ctx){
      ctx.font = "400 11px " + M; ctx.fillStyle = "#7A7A7A";
      for (var f = 0; f < fLines.length; f++) ctx.fillText(fLines[f], x, y + 11 + f * 15);
    }
    y += 11 + (fLines.length - 1) * 15;

    return y + IMG_PAD + 8;
  }

  var H = Math.ceil(walk(null));

  var cv = document.createElement("canvas");
  cv.width  = IMG_LW * IMG_SCALE;
  cv.height = H * IMG_SCALE;
  var ctx = cv.getContext("2d");
  ctx.scale(IMG_SCALE, IMG_SCALE);

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, IMG_LW, H);

  function finish(){ walk(ctx); cb(cv); }

  /* the topo contours, reused from the live background so the image matches */
  var svg = document.getElementById("topoBg");
  if (!svg){ finish(); return; }
  try {
    var clone = svg.cloneNode(true);
    clone.setAttribute("width",  IMG_LW);
    clone.setAttribute("height", H);
    clone.setAttribute("preserveAspectRatio", "xMidYMid slice");
    clone.removeAttribute("id");
    clone.removeAttribute("style");
    var paths = clone.querySelectorAll("path");
    for (var p = 0; p < paths.length; p++){
      paths[p].setAttribute("fill", "none");
      paths[p].setAttribute("stroke", "#1A1A1A");
      paths[p].setAttribute("stroke-width", "6");
    }
    var src = "data:image/svg+xml;charset=utf-8," +
              encodeURIComponent(new XMLSerializer().serializeToString(clone));
    var img = new Image();
    img.onload = function(){
      ctx.globalAlpha = .62;
      ctx.drawImage(img, 0, 0, IMG_LW, H);
      ctx.globalAlpha = 1;
      /* fade the middle so the type stays the loudest thing on the card */
      var g = ctx.createRadialGradient(IMG_LW / 2, H * .42, 0, IMG_LW / 2, H * .42, Math.max(IMG_LW, H) * .72);
      g.addColorStop(0,   "rgba(0,0,0,0.92)");
      g.addColorStop(0.55, "rgba(0,0,0,0.55)");
      g.addColorStop(1,   "rgba(0,0,0,0.25)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, IMG_LW, H);
      finish();
    };
    img.onerror = function(){ finish(); };
    img.src = src;
  } catch (e){ finish(); }
}

function imageFilename(){
  var c = S.current;
  var who = (c.student || "Student").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
  return "Debrief-" + who + "-" + (c.date || "").slice(0, 10) + ".png";
}

/* fallback for anywhere the share sheet is unavailable: show it full screen so
   iOS long-press -> "Add to Photos" still works, and offer a plain download */
function showImageFallback(cv, name){
  var ov = document.createElement("div");
  ov.className = "imgov";
  ov.innerHTML = '<div class="imgov-bar"><span class="eyebrow">PRESS AND HOLD THE IMAGE · ADD TO PHOTOS</span>'
               + '<button class="link" type="button">Close</button></div>';
  var holder = document.createElement("div");
  holder.className = "imgov-scroll";
  var im = new Image();
  im.src = cv.toDataURL("image/png");
  im.alt = "Flight debrief";
  holder.appendChild(im);
  var dl = document.createElement("a");
  dl.className = "ghost imgov-dl";
  dl.textContent = "Download";
  dl.href = im.src; dl.download = name;
  holder.appendChild(dl);
  ov.appendChild(holder);
  ov.querySelector("button").addEventListener("click", function(){ ov.remove(); });
  document.body.appendChild(ov);
}

function saveDebriefImage(btn){
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = "Rendering…";
  function done(){ btn.disabled = false; btn.textContent = old; }

  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  ready.catch(function(){}).then(function(){
    try {
      debriefImageCanvas(function(cv){
        var name = imageFilename();
        if (!cv.toBlob){ showImageFallback(cv, name); done(); return; }
        cv.toBlob(function(blob){
          if (!blob){ showImageFallback(cv, name); done(); return; }
          var file = null;
          try { file = new File([blob], name, { type: "image/png" }); } catch (e){}
          /* files only — adding title/text pushes iOS to share it as a link */
          if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
            navigator.share({ files: [file] }).then(done, function(err){
              if (err && err.name === "AbortError"){ done(); return; }
              showImageFallback(cv, name); done();
            });
          } else {
            showImageFallback(cv, name); done();
          }
        }, "image/png");
      });
    } catch (e){ toast("Could not build the image"); done(); }
  });
}

/* ---------- boot ---------- */
load();
if(S.lastLib && LIB[S.lastLib]) $("f-course").value=S.lastLib;
libTheme();
renderPicker(); renderHome();
if(S.current && !S.current.done){
  /* keep the in-progress flight one tap away, but open on Home */
  show("home");
} else show("home");
})();
